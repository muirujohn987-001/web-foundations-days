<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5 - Fetch API Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f7fb;
            color: #222;
        }

        h1 {
            color: #173b67;
        }

        button, input {
            padding: 10px;
            margin: 8px 0;
            font-size: 16px;
        }

        button {
            background-color: #173b67;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        input {
            width: 95%;
            max-width: 400px;
        }

        #users-list {
            padding: 0;
            list-style: none;
        }

        #users-list li {
            background: white;
            margin: 12px 0;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        #users-list h3 {
            color: #173b67;
        }

        #status {
            font-weight: bold;
        }
    </style>

    <script src="users.js" defer></script>
</head>

<body>
    <h1>Users Directory</h1>
    <p>Load users from an online API and filter them by name.</p>

    <button id="load-users" type="button">Load Users</button>

    <p id="status" role="status" aria-live="polite">
        Click the button to load users.
    </p>

    <label for="filter-input">Filter users by name:</label>
    <br>
    <input
        type="text"
        id="filter-input"
        placeholder="Enter a user's name..."
    >

    <ul id="users-list"></ul>
</body>
</html>
